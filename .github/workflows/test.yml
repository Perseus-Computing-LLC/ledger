name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2 (2026-07-16)

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 (2025-04-24)
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -c constraints.txt pyyaml pytest

      - name: Lint — py_compile
        run: |
          python3 -m py_compile ledger.py
          python3 -m py_compile ledger_route.py

      - name: Smoke test — version flag
        run: |
          python3 ledger.py --version | grep 'ledger v'
          python3 ledger_route.py --version | grep 'ledger v'

      - name: Smoke test — help output
        run: |
          python3 ledger.py --help > /dev/null
          python3 ledger_route.py --help > /dev/null

      - name: Price table freshness guard
        run: PYTHONPATH=. python3 tools/check_price_freshness.py

      # Classified: only a clean JSON run (or the specifically recognized
      # unavailable-state-DB case) passes — real failures are never absorbed.
      - name: Smoke test — json mode (classified)
        run: python3 tools/json_smoke.py

      - name: Run tests
        run: python3 -m pytest test_ledger.py -v

  engine:
    name: engine (ledger_agent) — ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Full Python range on Linux (matches the pyproject classifiers),
        # plus Windows + macOS smoke on a current Python for cross-platform parity.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2 (2026-07-16)
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 (2025-04-24)
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (with extras)
        run: pip install -c constraints.txt ".[all]" pytest pytest-cov

      - name: Lint — compileall
        run: python -m compileall -q ledger_agent

      - name: CLI smoke
        shell: bash  # Git Bash on Windows — the pipes/grep/line-continuations need it
        run: |
          ledger version | grep 'ledger v'
          ledger pricing | grep -i 'Pro'
          ledger init --org "CI Co" --tier pro --workspace ci --budget 10
          ledger meter --provider anthropic --model claude-opus-4-8 \
            --task code_review --workspace ci --input 1000 --output 500
          ledger status

      # Default testpaths (tests/ + root test_ledger.py) on every matrix leg,
      # with a coverage gate. fail-under 65: baseline 71% (2026-08-12).
      - name: Run engine + server + root monitor tests (coverage gate)
        run: python -m pytest -v --cov=ledger_agent --cov=ledger --cov-report=term-missing --cov-fail-under=65
