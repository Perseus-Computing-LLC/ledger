name: Public launch smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2 (2026-07-16)
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 (2025-04-24)
        with:
          python-version: "3.12"
      - name: Verify required secrets are configured
        # The smoke itself fails closed without these, but failing at the
        # workflow level with a clear message beats a post-hoc tool failure.
        env:
          BASE_URL: ${{ secrets.LEDGER_SMOKE_BASE_URL }}
          ADMIN_TOKEN: ${{ secrets.LEDGER_SMOKE_ADMIN_TOKEN }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::error::LEDGER_SMOKE_BASE_URL secret is not configured; public smoke cannot run."
            exit 1
          fi
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "::error::LEDGER_SMOKE_ADMIN_TOKEN secret is not configured; public smoke cannot run."
            exit 1
          fi
          echo "Both required secrets are configured."
      - name: Run public contract smoke test
        env:
          LEDGER_SMOKE_BASE_URL: ${{ secrets.LEDGER_SMOKE_BASE_URL }}
          LEDGER_SMOKE_ADMIN_TOKEN: ${{ secrets.LEDGER_SMOKE_ADMIN_TOKEN }}
        run: python tools/public_launch_smoke.py
