name: Publish to MCP Registry

# Publishes server.json to registry.modelcontextprotocol.io.
# Runs after a Release, or on demand. Auth is GitHub OIDC (no token):
# the workflow's identity proves ownership of the io.github.Perseus-Computing-LLC
# namespace.
#
# Robustness (pattern from perseus-vault):
#   1. The version in server.json is checked against ledger_agent.__version__
#      by scripts/registry_metadata_check.py — a stale hand-maintained version
#      can never be published (the registry is immutable per version).
#   2. The publish waits for the GHCR image tag to exist first — the release
#      workflow (docker job) and this workflow race each other, and the
#      registry validates that the OCI image exists.
#   3. The registry rejects descriptions over 100 characters (422) — the gate
#      asserts the limit before anything is attempted.

on:
  pull_request:
  push:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install --quiet -e . pytest
      - name: Run MCP server tests
        run: python -m pytest tests/test_mcp.py -q
      - name: Verify registry metadata
        run: python scripts/registry_metadata_check.py

  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    needs: verify-registry
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from ledger_agent import __version__
          print(f"VERSION={__version__}")
          PY
        shell: bash

      - name: Wait for GHCR image tag
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          REPO: perseus-computing-llc/ledger
        run: |
          for i in $(seq 1 30); do
            TOKEN="$(curl -fsS "https://ghcr.io/token?scope=repository:${REPO}:pull" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
            if curl -fsS -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.oci.image.manifest.v1+json" \
              "https://ghcr.io/v2/${REPO}/manifests/${VERSION}"; then
              echo "Image ${REPO}:${VERSION} is available."
              exit 0
            fi
            echo "Attempt ${i}/30: ${REPO}:${VERSION} not in GHCR yet, sleeping 30s..."
            sleep 30
          done
          echo "::error::GHCR image ${REPO}:${VERSION} never appeared — check the Release workflow for this tag."
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_amd64.tar.gz" \
            | tar -xz mcp-publisher

      - name: Authenticate (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
