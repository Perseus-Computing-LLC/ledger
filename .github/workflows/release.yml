name: Release

# Push a tag like `v0.2.0` to publish:
#   git tag v0.2.0 && git push origin v0.2.0
#
# PyPI uses Trusted Publishing (OIDC) — no stored token. One-time setup:
#   pypi.org → your project → Publishing → add a GitHub publisher:
#     owner=Perseus-Computing-LLC  repo=ledger  workflow=release.yml  env=pypi
# The Docker image publishes to GHCR using the built-in GITHUB_TOKEN (no setup).

on:
  push:
    tags: ["v*"]
  # Single trigger: tag-push only. (Previously this also fired on
  # `release: published`, so cutting a GitHub Release from a tag ran the
  # workflow twice and the second PyPI publish 400'd on "file already exists".)

permissions:
  contents: read

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # required for Trusted Publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2 (2026-07-16)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 (2025-04-24)
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          pip install -c constraints.txt build
          python -m build
      - name: Check metadata
        run: |
          pip install -c constraints.txt twine
          twine check dist/*
      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1 (2026-07-28)

  docker:
    name: Publish Docker image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push to ghcr.io
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2 (2026-07-16)
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3 (2026-01-27)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5 (2025-11-27)
        with:
          images: ghcr.io/perseus-computing-llc/ledger
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build + push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6 (2026-02-12)
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
