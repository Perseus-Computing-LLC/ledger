openapi: 3.1.0
info:
  title: Perseus Ledger /v1 API
  # Frozen legacy-compatible `/v1` contract (SemVer), pinned to
  # ledger_agent.__api_version__.
  # Intentionally independent of the package version: bump ONLY on a wire change
  # (additive = minor, breaking = major), NOT on every package release.
  # test_version_single_source.py asserts this equals __api_version__.
  version: "1.0.0"
  description: |
    The Perseus Ledger `/v1` HTTP API — event ingest, export, and operator
    administration for a self-hostable, hash-chained evidence ledger.

    **This document is the frozen 1.0 contract.** Perseus and Perseus Vault build against
    it; within the 1.0 major line it changes only additively (new optional fields,
    new endpoints). Breaking changes require a `/v2`. See `docs/SCHEMA.md` for the
    paired database forward-compatibility policy.

    ## Authentication
    Three independent schemes, by path:
    - **`/v1/usage*`** — a per-org **API key** as `Authorization: Bearer ledger_sk_…`
      (minted in the dashboard or via the admin API).
    - **`/v1/admin/*`** — the single operator **admin token** as
      `Authorization: Bearer <admin token>` (config `admin.token` /
      `LEDGER_ADMIN_TOKEN`). Disabled (404) when no token is configured.
    - The dashboard and `/webhook/stripe` use session cookies and Stripe
      signatures respectively and are out of scope for `/v1`.

    All monetary values are **USD** (the ledger is USD-only). Timestamps are
    **Unix epoch seconds (UTC)**.
servers:
  - url: /
    description: The Perseus Ledger server origin (default http://127.0.0.1:8420).

tags:
  - name: usage
    description: Usage ingest and export (per-org API key).
  - name: admin
    description: Operator tenant management (admin token).

paths:
  /v1/usage:
    post:
      tags: [usage]
      summary: Meter one usage event or a batch.
      description: |
        Record one event (a JSON object) or a batch (a JSON array, 1–1000
        events) against the authenticated org. The whole batch is recorded in one
        serialized transaction (all-or-nothing on error).

        Supply an exact `cost_usd` for billing-grade accuracy; omit it to have the
        cost estimated from token counts (the result is flagged `unpriced` when no
        exact model price exists). A negative `cost_usd` is rejected (`400`).

        **Idempotency:** send an `Idempotency-Key` header to make retries safe —
        a duplicate replays the original response (`idempotent_replay: true`)
        instead of re-recording.
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/UsageEvent'
                - type: array
                  minItems: 1
                  maxItems: 1000
                  items: { $ref: '#/components/schemas/UsageEvent' }
      responses:
        '200':
          description: |
            Recorded. A single-event request returns the event result fields
            inline; a batch returns `results[]` plus block counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageResponse' }
        '400':
          description: Malformed body, missing `provider`, non-integer token field, or a negative/non-numeric `cost_usd`.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: Nothing landed — the free-tier quota and/or prepaid credit is exhausted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/UsageResponse'
                  - type: object
                    properties:
                      error: { type: string }
                      upgrade_url: { type: string }
        '413': { description: Request body exceeds 1 MiB. }
        '429':
          description: Per-key rate limit exceeded.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: A request with the same `Idempotency-Key` is still in flight.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/composition/admit:
    post:
      tags: [usage]
      summary: Admit one tool action against trusted composition state.
      description: |
        Resolve the exact tool endpoint and validated arguments through the
        server-configured trusted taxonomy, then evaluate the action against
        the durable task-lineage/session history. Unknown, aliased, ambiguous,
        malformed, or unprofiled actions return an explicit `review` result;
        they never fail open. The request cannot supply taxonomy, policy,
        impact, classification, risk, or cost metadata. Only an `allow` verdict
        may be bound into a later usage event/prebind; the verdict contains
        hashes and a safe projection, not raw arguments.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompositionAdmissionRequest' }
      responses:
        '200':
          description: Hash-only composition verdict (`allow`, `deny`, `hold`, or `review`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompositionVerdict' }
        '400':
          description: Malformed JSON or a request attempting to provide trusted profile/policy values.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503':
          description: Composition admission is not configured by the embedding server.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/campaigns:
    get:
      tags: [usage]
      summary: Read one org-scoped acceptance campaign.
      security:
        - apiKey: []
      parameters:
        - name: campaign_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Public-safe manifest, checks, receipt, and verification projection.
          content: { application/json: { schema: { $ref: '#/components/schemas/CampaignProjection' } } }
        '400': { description: Missing campaign_id. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Campaign not found in the authenticated org. }
    post:
      tags: [usage]
      summary: Create or idempotently recover an acceptance campaign manifest.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manifest]
              properties:
                manifest: { $ref: '#/components/schemas/CampaignManifest' }
              additionalProperties: false
      responses:
        '201':
          description: Campaign created or the same manifest was replayed.
          content: { application/json: { schema: { $ref: '#/components/schemas/CampaignProjection' } } }
        '400': { description: Invalid or conflicting manifest. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/campaigns/checks:
    post:
      tags: [usage]
      summary: Persist one immutable campaign cell/check result.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [check]
              properties:
                check: { $ref: '#/components/schemas/CampaignCheck' }
              additionalProperties: false
      responses:
        '201':
          description: Check stored or the same check was replayed.
          content: { application/json: { schema: { $ref: '#/components/schemas/CampaignProjection' } } }
        '400': { description: Invalid, conflicting, or out-of-lineage check. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Campaign not found in the authenticated org. }
  /v1/campaigns/finalize:
    post:
      tags: [usage]
      summary: Persist a final campaign receipt and independent verification state.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [receipt]
              properties:
                receipt: { $ref: '#/components/schemas/CampaignReceipt' }
              additionalProperties: false
      responses:
        '200':
          description: Final receipt stored or the same receipt was replayed.
          content: { application/json: { schema: { $ref: '#/components/schemas/CampaignProjection' } } }
        '400': { description: Invalid or conflicting receipt. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Campaign not found in the authenticated org. }

  /v1/usage/export.csv:
    get:
      tags: [usage]
      summary: Export this org's usage events as CSV.
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Until'
      responses:
        '200':
          description: CSV with a header row, newest first.
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/usage/export.json:
    get:
      tags: [usage]
      summary: Export this org's usage events as JSON.
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Until'
      responses:
        '200':
          description: Org-scoped events, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  org_id: { type: string }
                  count: { type: integer }
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/ExportedEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/admin/orgs:
    get:
      tags: [admin]
      summary: List organizations.
      security: [{ adminToken: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Organizations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  orgs:
                    type: array
                    items: { $ref: '#/components/schemas/Org' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '404': { $ref: '#/components/responses/AdminDisabled' }
    post:
      tags: [admin]
      summary: Create an organization.
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                tier: { $ref: '#/components/schemas/Tier' }
      responses:
        '201':
          description: Created.
          content: { application/json: { schema: { $ref: '#/components/schemas/Org' } } }
        '400': { description: Missing name or invalid tier. }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '404': { $ref: '#/components/responses/AdminDisabled' }

  /v1/admin/credits:
    post:
      tags: [admin]
      summary: Post a credit grant or adjustment.
      description: |
        Append a `grant` (must be positive) or an `adjust` (any non-zero finite
        amount, positive or negative) to an org's ledger. Use `adjust` to debit;
        metered debits never come through here.
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org_id, amount_usd]
              properties:
                org_id: { type: string }
                amount_usd: { type: number, description: "Non-zero, finite. Must be > 0 when kind=grant." }
                kind: { type: string, enum: [grant, adjust], default: grant }
                reason: { type: string }
      responses:
        '201':
          description: Posted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  org_id: { type: string }
                  kind: { type: string }
                  amount_usd: { type: number }
                  balance_after: { type: number }
        '400': { description: Bad kind, non-finite/zero amount, or a negative grant. }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '404': { description: Unknown org, or admin API disabled. }

  /v1/admin/keys:
    get:
      tags: [admin]
      summary: List an org's API keys (secrets never returned).
      security: [{ adminToken: [] }]
      parameters:
        - { name: org, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Keys (metadata only).
          content:
            application/json:
              schema:
                type: object
                properties:
                  org_id: { type: string }
                  keys:
                    type: array
                    items: { $ref: '#/components/schemas/ApiKeyInfo' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '404': { description: Unknown org, or admin API disabled. }
    post:
      tags: [admin]
      summary: Mint an API key (secret returned once).
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org_id]
              properties:
                org_id: { type: string }
                name: { type: string }
      responses:
        '201':
          description: Created. The `secret` is shown once and is unrecoverable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  org_id: { type: string }
                  name: { type: string, nullable: true }
                  secret: { type: string }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '404': { description: Unknown org, or admin API disabled. }

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: A per-org API key (`ledger_sk_…`).
    adminToken:
      type: http
      scheme: bearer
      description: The operator admin token (`admin.token` / `LEDGER_ADMIN_TOKEN`).

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string }
      description: Opt-in retry-safety key, scoped per org.
    Since:
      name: since
      in: query
      required: false
      schema: { type: number }
      description: Lower bound (inclusive) on event timestamp, epoch seconds.
    Until:
      name: until
      in: query
      required: false
      schema: { type: number }
      description: Upper bound (exclusive) on event timestamp, epoch seconds.

  responses:
    Unauthorized:
      description: Missing or invalid API key.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    AdminUnauthorized:
      description: Admin token missing or wrong.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    AdminDisabled:
      description: Admin API not enabled (no `admin.token` configured).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    Tier:
      type: string
      enum: [free, pro, enterprise]
    Error:
      type: object
      properties:
        error: { type: string }
    UsageEvent:
      type: object
      required: [provider]
      properties:
        provider: { type: string, example: anthropic }
        model: { type: string, nullable: true, example: claude-opus-4-8 }
        task_type: { type: string, default: general }
        workspace: { type: string, nullable: true, description: "id, slug, or name; auto-created within the tier's workspace cap. If the cap (Free = 1) is already reached, the event instead folds into the org's earliest workspace and the result flags workspace_folded." }
        input_tokens: { type: integer, default: 0 }
        output_tokens: { type: integer, default: 0 }
        cache_read_tokens: { type: integer, default: 0 }
        cache_write_tokens: { type: integer, nullable: true, description: "Provider-reported cache creation/write tokens; priced separately when a cache-write rate is published." }
        reasoning_tokens: { type: integer, default: 0 }
        user_id: { type: string, nullable: true, description: "Active organization user/seat responsible for the event (#136)." }
        cost_usd: { type: number, nullable: true, description: "Exact cost; omit to estimate from tokens. Must be >= 0." }
        baseline_cost_usd: { type: number, nullable: true, description: "Savings-share counterfactual in USD (#7): what this call would have cost without the optimization. Must be >= 0; omit for none." }
        baseline_model: { type: string, nullable: true, description: "Savings-share counterfactual model (#7): the same token counts priced at this model's published rate (model-substitution savings). When baseline_input_tokens/baseline_output_tokens are present, prices those counterfactual counts instead." }
        baseline_input_tokens: { type: integer, nullable: true, description: "Token-reduction counterfactual (#134): input tokens this call would have sent without the optimization (e.g. the full-context prompt a recall replaced). Priced at baseline_model if given, else this event's model. Must be >= 0." }
        baseline_output_tokens: { type: integer, nullable: true, description: "Token-reduction counterfactual output tokens (#134). Must be >= 0." }
        external_ref: { type: string, nullable: true, description: "Per-task/per-question attribution id (e.g. an Invarium task_id) linking this event to the task that produced it." }
        evidence_hashes: { type: array, nullable: true, items: { type: string, pattern: '^[0-9a-fA-F]{64}$' }, description: "SHA-256 hashes of source artifacts/evidence. Canonicalized, deduplicated, and hash-chained when supplied." }
        policy_version: { type: string, nullable: true, description: "Identifier for the policy/configuration governing the decision." }
        result_hash: { type: string, nullable: true, pattern: '^[0-9a-fA-F]{64}$', description: "SHA-256 hash of the resulting artifact or conclusion." }
        human_review: { type: string, nullable: true, enum: [approved, rejected, corrected], description: "Human disposition for the autonomous action." }
        correction_ref: { type: string, nullable: true, description: "Opaque identifier of the human correction; required for a corrected disposition." }
        agent_id: { type: string, nullable: true, description: "AAR actor identity. Required with the other action-provenance fields when any AAR field is supplied." }
        authority_manifest_ref: { type: string, nullable: true, description: "Opaque authority-manifest reference from the enforcement plane." }
        scope_anchor: { type: string, nullable: true, description: "Opaque trusted scope anchor bound to the action." }
        action_intent_hash: { type: string, nullable: true, pattern: '^[0-9a-fA-F]{64}$', description: "SHA-256 digest of the action intent." }
        action_status: { type: string, nullable: true, enum: [intent, approval_requested, approved, denied, expired, executed, failed, cancelled], description: "AAR lifecycle status supplied by the enforcement plane." }
        approval_ref: { type: string, nullable: true, description: "Opaque approval reference; required for approved, denied, or expired action statuses." }
        context_render_schema: { type: string, nullable: true, description: "Versioned schema identifier for the hash-only context-render binding." }
        context_render_hash: { type: string, nullable: true, pattern: '^[0-9a-fA-F]{64}$', description: "SHA-256 digest of the rendered context; raw context is never stored." }
        served_memory_provenance_hash: { type: string, nullable: true, pattern: '^[0-9a-fA-F]{64}$', description: "SHA-256 digest of the served-memory provenance projection." }
        action_receipt_hash: { type: string, nullable: true, pattern: '^[0-9a-fA-F]{64}$', description: "SHA-256 digest binding an upstream action receipt." }
        resource_constraints_version: { type: string, nullable: true, description: "Opaque version of the resource-constraints projection." }
        resource_constraints_hash: { type: string, nullable: true, pattern: '^[0-9a-fA-F]{64}$', description: "SHA-256 digest of the resource-constraints projection; raw constraints are never stored." }
        prebind:
          $ref: '#/components/schemas/Prebind'
        served_claim: { type: object, nullable: true, description: "Hash-only served-claim evidence object binding a source reference to this event (#221)." }
        evidence_status: { type: string, nullable: true, enum: [fresh, partial, timeout, unavailable, empty, stale, abstain, review], description: "Degraded-evidence state recorded with the event (#222)." }
        runtime_manifest: { type: object, nullable: true, description: "Hash-bound runtime manifest for the adapter that produced this event (#223)." }
        external_artifact_binding: { type: object, nullable: true, description: "Hash-bound external-artifact prior-action/idempotency binding (#224)." }
        belief_context: { type: object, nullable: true, description: "Decision-time belief-context evidence block (believed/assumed/ignored); hash-bound and HMAC-covered in receipts (#237)." }
        governance_cost: { type: object, nullable: true, description: "Governance self-cost block (wall_ms/cpu_ms/mem_bytes/storage_bytes/tokens/model_calls/approval_waits_ms); internal telemetry excluded from customer-facing totals (#239)." }
        behavior_snapshot: { type: object, nullable: true, description: "Behavior-snapshot receipt pin carrying the sha256 of a canonical agent-run snapshot (#238)." }
        authority_manifest_custody: { type: string, nullable: true, description: "Custody disclosure label for the referenced authority manifest (1f916 taxonomy); unknown custody renders as labeled uncertainty (#241)." }
        campaign_binding: { $ref: '#/components/schemas/CampaignBinding' }
        composition_verdict: { $ref: '#/components/schemas/CompositionVerdict' }
        source: { type: string, default: api }
    CompositionAdmissionRequest:
      type: object
      additionalProperties: false
      description: "Request fields for trusted composition admission. Taxonomy, policy, impact, classification, risk, and cost are server-owned and cannot be supplied here."
      required: [task_lineage_id, session_id, workspace_scope, authority_action_id, authority_ref, context_head_digest, action_id, tool_endpoint]
      properties:
        task_lineage_id: { type: string }
        session_id: { type: string }
        workspace_scope: { type: string }
        authority_action_id: { type: string, description: "Opaque AAR/prebind action identifier supplied by the authority plane; ordinary admissions must match the signed lineage root, while an override must match its signed authority action identifier." }
        authority_ref: { type: string }
        context_head_digest: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
        action_id: { type: string }
        tool_endpoint: { type: string, description: "Exact canonical endpoint from the trusted taxonomy; aliases are rejected." }
        arguments: { type: object, additionalProperties: true, description: "Validated against the trusted profile; values are committed only by digest." }
        idempotency_key: { type: string, nullable: true }
        override: { type: object, nullable: true, description: "Authenticated, pre-declared authority override; model text and retrieved content cannot create one." }
        lineage_authorization: { type: object, nullable: true, description: "Signed authority decision that may initialize this lineage; it is required when the durable lineage does not already exist." }
    CompositionVerdict:
      type: object
      additionalProperties: false
      description: "Hash-bound composition result. Review/hold responses contain the common decision fields; an allow verdict includes the full hash-bound admission fields. Raw tool arguments are never returned or persisted in this projection."
      required: [schema, outcome, reason_code, action_id, task_lineage_id, session_id, workspace_scope]
      properties:
        schema: { type: string, const: perseus-ledger-composition-verdict/v1 }
        outcome: { type: string, enum: [allow, deny, hold, review, abstain] }
        reason_code: { type: string }
        action_id: { type: string }
        task_lineage_id: { type: string }
        session_id: { type: string }
        workspace_scope: { type: string }
        authority_action_id: { type: string }
        authority_ref: { type: string }
        context_head_digest: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
        policy_version: { type: string }
        policy_hash: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
        policy_scope: { type: string, enum: [task, session] }
        taxonomy_version: { type: string }
        taxonomy_hash: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
        profile_digest: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
        action_digest: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
        action_class: { type: string }
        resource_hash: { type: string, pattern: '^[0-9a-fA-F]{64}$', description: "SHA-256 digest of the normalized resource; the resource argument is never returned." }
        data_classification: { type: string, enum: [public, internal, confidential, restricted] }
        impact: { type: string, enum: [low, medium, high, critical] }
        budget_cost: { type: number, minimum: 0 }
        budget_used_before: { type: number, minimum: 0 }
        budget_used_after: { type: number, minimum: 0 }
        prior_action_classes: { type: array, items: { type: string } }
        prior_state_hash: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
        state_hash: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
        state_version: { type: integer, minimum: 0 }
        sequence_no: { type: integer, minimum: 0 }
        matched_sequence: { type: array, items: { type: string } }
        override_ref: { type: string, nullable: true }
        idempotent_replay: { type: boolean, nullable: true }
        state_mutated: { type: boolean, nullable: true }
        composition_hash: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
    CompositionBinding:
      type: object
      additionalProperties: false
      description: "Hash-only composition projection suitable for prebind and evidence receipts."
      required: [schema, policy_version, policy_hash, taxonomy_version, taxonomy_hash, state_hash, profile_digest, action_digest, action_id, task_lineage_id, authority_action_id, authority_ref, context_head_digest, workspace_scope, verdict, composition_hash]
      properties:
        schema: { type: string, const: perseus-ledger-composition-binding/v1 }
        policy_version: { type: string }
        policy_hash: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
        taxonomy_version: { type: string }
        taxonomy_hash: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
        state_hash: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
        profile_digest: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
        action_digest: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
        action_id: { type: string }
        task_lineage_id: { type: string }
        authority_action_id: { type: string }
        authority_ref: { type: string }
        context_head_digest: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
        workspace_scope: { type: string }
        verdict: { type: string, enum: [allow, deny, hold, review, abstain] }
        composition_hash: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
    CampaignBinding:
      type: object
      additionalProperties: false
      description: "Hash-only campaign/cell/lane/config/checkpoint binding."
      required: [schema, campaign_id, cell_id, lane, config_hash, attempt, continuation, binding_hash]
      properties:
        schema: { type: string, const: perseus-ledger-campaign-binding/v1 }
        campaign_id: { type: string }
        cell_id: { type: string }
        lane: { type: string }
        config_hash: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
        attempt: { type: integer, minimum: 1 }
        continuation: { type: boolean }
        parent_attempt: { type: integer, minimum: 1, nullable: true }
        action_intent_hash: { type: string, pattern: '^[0-9a-fA-F]{64}$', nullable: true }
        checkpoint_ref: { type: string, nullable: true }
        binding_hash: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
    CampaignManifest:
      type: object
      additionalProperties: false
      description: "Hash-only acceptance campaign plan; raw benchmark inputs remain out of band."
      required: [schema, campaign_id, planned_cells, provider_lanes, config_hash, fixture_hash, retry_policy, continuation_allowed, evidence_required, manifest_hash]
      properties:
        schema: { type: string, const: perseus-ledger-acceptance-campaign/v1 }
        campaign_id: { type: string }
        planned_cells: { type: array, minItems: 1, items: { type: string } }
        provider_lanes: { type: array, minItems: 1, items: { type: string } }
        config_hash: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
        fixture_hash: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
        target_ref: { type: string, nullable: true }
        target_commit_hash: { type: string, pattern: '^[0-9a-fA-F]{64}$', nullable: true }
        target_build_hash: { type: string, pattern: '^[0-9a-fA-F]{64}$', nullable: true }
        runtime_identity: { type: string, nullable: true }
        expected_spend_min_micros: { type: integer, minimum: 0, nullable: true }
        expected_spend_max_micros: { type: integer, minimum: 0, nullable: true }
        hard_stop_micros: { type: integer, minimum: 0, nullable: true }
        runaway_guard_micros: { type: integer, minimum: 0, nullable: true }
        retry_policy: { type: string, enum: [none, same_config, new_version_only, explicit_continuation] }
        continuation_allowed: { type: boolean }
        action_intent_hash: { type: string, pattern: '^[0-9a-fA-F]{64}$', nullable: true }
        evidence_required: { type: boolean }
        manifest_hash: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
    CampaignCheck:
      type: object
      additionalProperties: false
      description: "One hash-bound campaign cell result or explicit skip/error."
      required: [schema, campaign_id, cell_id, lane, status, config_hash, attempt, continuation, evidence_hashes, usage_event_ids, check_hash]
      properties:
        schema: { type: string, const: perseus-ledger-acceptance-check/v1 }
        campaign_id: { type: string }
        cell_id: { type: string }
        lane: { type: string }
        status: { type: string, enum: [pass, fail, skip, error] }
        config_hash: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
        attempt: { type: integer, minimum: 1 }
        continuation: { type: boolean }
        parent_attempt: { type: integer, minimum: 1, nullable: true }
        action_intent_hash: { type: string, pattern: '^[0-9a-fA-F]{64}$', nullable: true }
        result_hash: { type: string, pattern: '^[0-9a-fA-F]{64}$', nullable: true }
        evidence_hashes: { type: array, items: { type: string, pattern: '^[0-9a-fA-F]{64}$' } }
        usage_event_ids: { type: array, items: { type: string } }
        checkpoint_ref: { type: string, nullable: true }
        reason_code: { type: string, nullable: true }
        check_hash: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
    CampaignReceipt:
      type: object
      additionalProperties: false
      description: "Final hash-bound campaign envelope; verified_pass is independent of target_status."
      required: [schema, campaign_id, manifest_hash, framework_status, target_status, budget_status, evidence_status, finalization_status, counts, check_hashes, spent_micros, receipt_hash]
      properties:
        schema: { type: string, const: perseus-ledger-acceptance-receipt/v1 }
        campaign_id: { type: string }
        manifest_hash: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
        framework_status: { type: string, enum: [completed, error, interrupted, cancelled] }
        target_status: { type: string, enum: [pass, fail, inconclusive, not_run] }
        budget_status: { type: string, enum: [not_configured, within_guard, stopped, overrun] }
        evidence_status: { type: string, enum: [pending, complete, incomplete, invalid] }
        finalization_status: { type: string, enum: [pending, complete, failed] }
        finalization_reason: { type: string, nullable: true }
        counts: { type: object, additionalProperties: { type: integer, minimum: 0 } }
        check_hashes: { type: array, items: { type: string, pattern: '^[0-9a-fA-F]{64}$' } }
        target_identity: { type: object }
        evidence_bundle_hash: { type: string, pattern: '^[0-9a-fA-F]{64}$', nullable: true }
        protected_state_before_hash: { type: string, pattern: '^[0-9a-fA-F]{64}$', nullable: true }
        protected_state_after_hash: { type: string, pattern: '^[0-9a-fA-F]{64}$', nullable: true }
        cleanup_manifest_hash: { type: string, pattern: '^[0-9a-fA-F]{64}$', nullable: true }
        spent_micros: { type: integer, minimum: 0 }
        remaining_micros: { type: integer, minimum: 0, nullable: true }
        stop_reason: { type: string, nullable: true }
        last_checkpoint_ref: { type: string, nullable: true }
        verification: { type: object }
        receipt_hash: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
    CampaignProjection:
      type: object
      properties:
        org_id: { type: string }
        campaign_id: { type: string }
        manifest: { $ref: '#/components/schemas/CampaignManifest' }
        checks: { type: array, items: { $ref: '#/components/schemas/CampaignCheck' } }
        receipt: { allOf: [{ $ref: '#/components/schemas/CampaignReceipt' }], nullable: true }
        verification: { type: object }
        spend_micros: { type: integer, minimum: 0 }
        usage_events: { type: integer, minimum: 0 }
        budget_status: { type: string }
        stop_reason: { type: string, nullable: true }
        updated_at: { type: number }
    Prebind:
      type: object
      additionalProperties: false
      description: "Hash-bound, raw-payload-free pre-action assurance block."
      required: [schema_version, attempted_action, actor_ref, authority_ref, trusted_scope, policy_version, evidence_hashes, selected_context_digest, resource_ref, boundary_outcome, non_effective_result, replay_id, stage_refs, prebind_hash]
      properties:
        schema_version: { type: string, const: perseus-ledger-prebind/v1 }
        attempted_action: { type: string }
        actor_ref: { type: string }
        authority_ref: { type: string }
        trusted_scope: { type: string }
        policy_version: { type: string }
        evidence_hashes:
          type: array
          minItems: 1
          items: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
        selected_context_digest: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
        resource_ref: { type: string }
        boundary_outcome: { type: string, enum: [allow, hold, deny, abstain, interrupt, recover] }
        non_effective_result: { type: string, enum: [not_executed, held, denied, abstained, cancelled, failed] }
        replay_id: { type: string }
        approval_ref: { type: string, nullable: true }
        stage_refs:
          type: array
          items: { type: string }
        prebind_hash: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
        composition_binding: { $ref: '#/components/schemas/CompositionBinding' }
    EventResult:
      type: object
      properties:
        recorded: { type: boolean }
        event_id: { type: string, nullable: true }
        cost_usd: { type: number }
        estimated: { type: boolean }
        balance_after: { type: number }
        over_free_limit: { type: boolean }
        over_balance: { type: boolean }
        unpriced: { type: boolean, description: "True when the cost is an estimate with no exact model price." }
        savings_usd: { type: number, description: "Per-event provable saving: max(0, baseline - cost); 0 when no baseline was recorded." }
        baseline_usd: { type: number, nullable: true, description: "Counterfactual cost the saving was computed against; null when no baseline was recorded." }
        leaked_usd: { type: number, description: "Per-event efficiency leakage vs the on-policy optimal (#8); 0 when no optimal was recorded." }
        workspace_id: { type: string, nullable: true, description: "The workspace the event was actually attributed to." }
        workspace_folded: { type: boolean, description: "True when the client-sent workspace did not exist and the tier's workspace cap (Free = 1) forced the event into the org's earliest workspace instead of creating a new one — the recorded attribution then differs from what was sent." }
        campaign_id: { type: string, nullable: true, description: "Campaign ID when the event carries a validated acceptance-campaign binding (#256/#257)." }
    UsageResponse:
      type: object
      description: |
        Always carries the org summary fields. A single-event request also
        inlines the `EventResult` fields; a batch instead carries `results[]`
        plus the block counts.
      properties:
        org_id: { type: string }
        tracked_tokens_mtd: { type: integer }
        tracked_limit: { type: integer, nullable: true }
        tier: { type: string }
        recorded:
          oneOf: [{ type: boolean }, { type: integer }]
          description: "Single event: boolean. Batch: count of recorded events."
        results:
          type: array
          description: Present for batches only.
          items: { $ref: '#/components/schemas/EventResult' }
        blocked: { type: integer, description: "Batch only — total rejected (free-limit + over-balance)." }
        free_limit_blocked: { type: integer, description: "Batch only." }
        over_balance_blocked: { type: integer, description: "Batch only." }
        idempotent_replay: { type: boolean, description: "Present and true when this is a replayed response for a duplicate Idempotency-Key." }
        workspace_note: { type: string, description: "Present when any event in the request was workspace-folded (see EventResult.workspace_folded): the tier cap redirected attribution to the org's earliest workspace." }
    ExportedEvent:
      type: object
      properties:
        id: { type: string }
        ts: { type: number }
        provider: { type: string }
        model: { type: string, nullable: true }
        task_type: { type: string }
        workspace: { type: string, nullable: true }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        cache_read_tokens: { type: integer }
        reasoning_tokens: { type: integer }
        cost_usd: { type: number }
        baseline_usd: { type: number, nullable: true, description: "Counterfactual cost recorded for savings-share; null when none." }
        external_ref: { type: string, nullable: true, description: "Per-task attribution id (e.g. an Invarium task_id)." }
        campaign_id: { type: string, nullable: true, description: "Acceptance campaign attribution ID when present." }
        campaign_binding: { $ref: '#/components/schemas/CampaignBinding' }
        composition: { $ref: '#/components/schemas/CompositionBinding' }
        estimated: { type: boolean }
        source: { type: string }
    Org:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        tier: { type: string }
        balance: { type: number, description: "Present in admin list responses." }
    ApiKeyInfo:
      type: object
      properties:
        id: { type: string }
        name: { type: string, nullable: true }
        prefix: { type: string }
        created_at: { type: number }
        last_used_at: { type: number, nullable: true }
        revoked_at: { type: number, nullable: true }
