[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perseus-ledger"
# Single-sourced from ledger_agent.__version__ (#57) so the wheel metadata and
# `ledger version` can never drift apart.
dynamic = ["version"]
description = "Perseus Ledger: verifiable, hash-chained provenance for autonomous-system events and resource allocation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Thomas Connally", email = "tcconnally@gmail.com" }]
maintainers = [{ name = "Perseus Computing LLC" }]
keywords = [
    "llm", "billing", "metering", "finops", "ai-agents", "stripe",
    "usage-based-billing", "cost-tracking", "openai", "anthropic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "PyYAML>=5.4,<7",
    "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
# Upper bounds pin against surprise major bumps of money/report-critical deps
# (reproducibility; deploy a hash-locked artifact for production — see
# docs/deploy-hardening.md).
stripe = ["stripe>=7.0,<14"]
# Optional exception capture for the HTTP server (ledger_agent/server/errorhook.py).
sentry = ["sentry-sdk>=2.0,<3"]
pdf = ["reportlab>=4.0,<5"]
# #109: provider cost fetchers for `ledger close`. Only AWS Bedrock (Cost
# Explorer) needs an SDK; OpenAI/Anthropic use stdlib urllib, no dependency.
fetchers = ["boto3>=1.28"]
# Optional: the Invarium bridge (ledger_agent.integrations.invarium) for
# accuracy-gated savings metering. Only needed to run tests/examples that pair
# behavioral verdicts with metering; the bridge itself is dependency-free.
invarium = ["invarium>=0.3"]
all = ["stripe>=7.0,<14", "reportlab>=4.0,<5", "boto3>=1.28", "sentry-sdk>=2.0,<3", "invarium>=0.3; python_version >= '3.10'", "jsonschema>=4.18,<5"]
dev = ["stripe>=7.0,<14", "reportlab>=4.0,<5", "boto3>=1.28", "pytest>=7.0,<10", "sentry-sdk>=2.0,<3", "invarium>=0.3; python_version >= '3.10'", "jsonschema>=4.18,<5"]

# ``uv run`` installs the default ``dev`` group, so the documented local test
# gate is self-provisioning. Keep this separate from runtime dependencies and
# mirror the optional ``dev`` extra above for pip consumers.
[dependency-groups]
dev = [
    "stripe>=7.0,<14",
    "reportlab>=4.0,<5",
    "boto3>=1.28",
    "pytest>=7.0,<10",
    "sentry-sdk>=2.0,<3",
    "invarium>=0.3; python_version >= '3.10'",
    "jsonschema>=4.18,<5",
]

[project.urls]
Homepage = "https://perseus.observer/ledger/"
Repository = "https://github.com/Perseus-Computing-LLC/ledger"
Issues = "https://github.com/Perseus-Computing-LLC/ledger/issues"

[project.scripts]
ledger = "ledger_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests", "test_ledger.py"]
addopts = "--strict-markers"
markers = [
  "integration: tests that exercise optional external integrations",
]

[tool.setuptools.dynamic]
version = { attr = "ledger_agent.__version__" }

[tool.setuptools]
# The repo also contains the production monitor (ledger.py / ledger_route.py) at
# the root; those ship and run independently and are NOT part of this package.
packages = [
    "ledger_agent",
    "ledger_agent.billing",
    "ledger_agent.server",
    "ledger_agent.integrations",
    "ledger_agent.schemas",
]

[tool.setuptools.package-data]
ledger_agent = ["schemas/*.json"]
